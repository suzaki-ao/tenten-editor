<!DOCTYPE html> <html lang="ja"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>SVG → 高画質画像変換ツール</title> <style> *{ box-sizing:border-box; } body{ margin:0; font-family: "Segoe UI", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif; background:#eef1f5; color:#20242a; } header{ background:#20252b; color:white; padding:20px 28px; } header h1{ margin:0; font-size:24px; } header p{ margin:7px 0 0; opacity:.75; } .container{ max-width:1400px; margin:25px auto; padding:0 18px; } .card{ background:white; border-radius:14px; padding:22px; margin-bottom:20px; box-shadow:0 5px 20px rgba(0,0,0,.07); } .dropzone{ border:3px dashed #aeb6c1; border-radius:14px; min-height:190px; display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer; transition:.2s; background:#fafbfc; } .dropzone:hover, .dropzone.dragover{ border-color:#3b82f6; background:#eff6ff; } .drop-icon{ font-size:50px; margin-bottom:8px; } .drop-title{ font-size:20px; font-weight:bold; } .drop-sub{ color:#68717c; margin-top:6px; } input[type=file]{ display:none; } .controls{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:15px; } .control{ display:flex; flex-direction:column; gap:7px; } .control label{ font-weight:bold; font-size:14px; } input[type=number], select, input[type=color], input[type=range]{ width:100%; } input[type=number], select{ border:1px solid #ccd2d9; border-radius:8px; padding:10px; font-size:15px; background:white; } input[type=color]{ height:42px; border:1px solid #ccd2d9; border-radius:8px; padding:3px; } input[type=range]{ accent-color:#3b82f6; } .row{ display:flex; gap:10px; align-items:center; } button{ border:0; border-radius:9px; padding:12px 18px; font-size:15px; font-weight:bold; cursor:pointer; transition:.15s; } button:hover{ transform:translateY(-1px); } .primary{ background:#2563eb; color:white; } .primary:hover{ background:#1d4ed8; } .secondary{ background:#e8edf3; color:#20242a; } .danger{ background:#dc2626; color:white; } .preview-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; } .preview-box{ min-height:420px; border:1px solid #d7dce2; border-radius:12px; overflow:auto; background: linear-gradient(45deg,#eee 25%,transparent 25%), linear-gradient(-45deg,#eee 25%,transparent 25%), linear-gradient(45deg,transparent 75%,#eee 75%), linear-gradient(-45deg,transparent 75%,#eee 75%); background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0; display:flex; align-items:center; justify-content:center; padding:20px; } .preview-box img, .preview-box canvas{ max-width:100%; max-height:650px; object-fit:contain; box-shadow:0 2px 12px rgba(0,0,0,.15); } .info{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; } .info-item{ background:#f4f6f8; border-radius:9px; padding:12px; } .info-label{ font-size:12px; color:#68717c; } .info-value{ font-weight:bold; margin-top:4px; word-break:break-all; } .status{ padding:13px 15px; border-radius:9px; background:#eef6ff; color:#1e40af; margin-top:15px; display:none; } .status.show{ display:block; } .warning{ padding:13px 15px; border-radius:9px; background:#fff7ed; color:#9a3412; margin-top:15px; } .size-result{ font-weight:bold; color:#2563eb; } .hidden{ display:none !important; } .download-area{ display:flex; gap:10px; flex-wrap:wrap; margin-top:15px; } @media(max-width:800px){ .preview-grid{ grid-template-columns:1fr; } .preview-box{ min-height:300px; } } </style> </head> <body> <header> <h1>SVG → 高画質画像変換ツール</h1> <p>SVGをPNG・JPG・WebPへ高解像度で変換して保存</p> </header> <div class="container"> <div class="card"> <div class="dropzone" id="dropzone"> <div> <div class="drop-icon">🖼️</div> <div class="drop-title">SVGファイルをここにドロップ</div> <div class="drop-sub">またはクリックしてSVGを選択</div> </div> </div> <input id="fileInput" type="file" accept=".svg,image/svg+xml"> <div id="status" class="status"></div> </div> <div id="mainArea" class="hidden"> <div class="card"> <h2>SVG情報</h2> <div class="info"> <div class="info-item"> <div class="info-label">ファイル名</div> <div class="info-value" id="fileName">---</div> </div> <div class="info-item"> <div class="info-label">SVGサイズ</div> <div class="info-value" id="svgSize">---</div> </div> <div class="info-item"> <div class="info-label">viewBox</div> <div class="info-value" id="viewBox">---</div> </div> <div class="info-item"> <div class="info-label">アスペクト比</div> <div class="info-value" id="aspect">---</div> </div> </div> </div> <div class="card"> <h2>出力設定</h2> <div class="controls"> <div class="control"> <label>画像形式</label> <select id="format"> <option value="png">PNG（高画質・透明対応）</option> <option value="jpeg">JPG（写真向け）</option> <option value="webp">WebP</option> </select> </div> <div class="control"> <label>倍率</label> <select id="scale"> <option value="1">1×</option> <option value="2">2×</option> <option value="3">3×</option> <option value="4" selected>4×</option> <option value="5">5×</option> <option value="6">6×</option> <option value="8">8×</option> <option value="10">10×</option> <option value="12">12×</option> <option value="16">16×</option> <option value="20">20×</option> <option value="custom">カスタムサイズ</option> </select> </div> <div class="control"> <label>幅（px）</label> <input type="number" id="width" min="1" value="1920"> </div> <div class="control"> <label>高さ（px）</label> <input type="number" id="height" min="1" value="1080"> </div> <div class="control"> <label>背景色</label> <input type="color" id="bgColor" value="#ffffff"> </div> <div class="control"> <label>JPG / WebP 品質</label> <div class="row"> <input type="range" id="quality" min="0.1" max="1" step="0.01" value="0.95" > <span id="qualityValue">95%</span> </div> </div> </div> <div class="warning"> PNGの場合、背景色を「透明」にすることもできます。 JPGは透明背景に対応していないため、指定した背景色が使用されます。 </div> <div style="margin-top:18px;"> <div> 出力サイズ： <span class="size-result" id="outputSize">---</span> </div> </div> <div class="download-area"> <button class="primary" id="convertBtn"> 🔄 画像へ変換 </button> <button class="secondary" id="resetBtn"> ↩ リセット </button> </div> </div> <div class="card"> <h2>プレビュー</h2> <div class="preview-grid"> <div> <h3>SVG</h3> <div class="preview-box"> <img id="svgPreview"> </div> </div> <div> <h3>変換後</h3> <div class="preview-box"> <canvas id="canvas"></canvas> </div> </div> </div> <div class="download-area"> <button class="primary" id="downloadBtn" disabled> 💾 画像を保存 </button> </div> </div> </div> </div> <script> const dropzone = document.getElementById("dropzone"); const fileInput = document.getElementById("fileInput"); const mainArea = document.getElementById("mainArea"); const status = document.getElementById("status"); const fileName = document.getElementById("fileName"); const svgSize = document.getElementById("svgSize"); const viewBox = document.getElementById("viewBox"); const aspect = document.getElementById("aspect"); const svgPreview = document.getElementById("svgPreview"); const canvas = document.getElementById("canvas"); const format = document.getElementById("format"); const scale = document.getElementById("scale"); const widthInput = document.getElementById("width"); const heightInput = document.getElementById("height"); const bgColor = document.getElementById("bgColor"); const quality = document.getElementById("quality"); const qualityValue = document.getElementById("qualityValue"); const outputSize = document.getElementById("outputSize"); const convertBtn = document.getElementById("convertBtn"); const downloadBtn = document.getElementById("downloadBtn"); const resetBtn = document.getElementById("resetBtn"); let currentSVG = ""; let currentFile = null; let svgURL = null; let convertedBlob = null; let originalWidth = 1000; let originalHeight = 1000; /* ================================ ファイル選択 ================================ */ dropzone.addEventListener("click", () => { fileInput.click(); }); fileInput.addEventListener("change", e => { if(e.target.files.length){ loadSVG(e.target.files[0]); } }); dropzone.addEventListener("dragover", e => { e.preventDefault(); dropzone.classList.add("dragover"); }); dropzone.addEventListener("dragleave", () => { dropzone.classList.remove("dragover"); }); dropzone.addEventListener("drop", e => { e.preventDefault(); dropzone.classList.remove("dragover"); const file = e.dataTransfer.files[0]; if(file){ loadSVG(file); } }); /* ================================ SVG読み込み ================================ */ async function loadSVG(file){ if(!file.name.toLowerCase().endsWith(".svg")){ showStatus("SVGファイルを選択してください。", true); return; } currentFile = file; currentSVG = await file.text(); fileName.textContent = file.name; const parser = new DOMParser(); const doc = parser.parseFromString( currentSVG, "image/svg+xml" ); const svg = doc.documentElement; if(svg.nodeName.toLowerCase() !== "svg"){ showStatus("有効なSVGとして読み込めませんでした。", true); return; } /* サイズ解析 */ let w = parseFloat( svg.getAttribute("width") ); let h = parseFloat( svg.getAttribute("height") ); const vb = svg.getAttribute("viewBox"); if(vb){ const values = vb .trim() .split(/[\s,]+/) .map(Number); if(values.length === 4){ if(!w || !Number.isFinite(w)){ w = values[2]; } if(!h || !Number.isFinite(h)){ h = values[3]; } viewBox.textContent = values.join(" "); } }else{ viewBox.textContent = "なし"; } if(!w || !Number.isFinite(w) || w <= 0){ w = 1000; } if(!h || !Number.isFinite(h) || h <= 0){ h = 1000; } originalWidth = w; originalHeight = h; svgSize.textContent = `${Math.round(w)} × ${Math.round(h)}`; aspect.textContent = (w / h).toFixed(4); /* SVGプレビュー */ if(svgURL){ URL.revokeObjectURL(svgURL); } const blob = new Blob( [currentSVG], {type:"image/svg+xml"} ); svgURL = URL.createObjectURL(blob); svgPreview.src = svgURL; /* 初期サイズ */ const initialScale = 4; widthInput.value = Math.max(1, Math.round(w * initialScale)); heightInput.value = Math.max(1, Math.round(h * initialScale)); scale.value = "4"; mainArea.classList.remove("hidden"); updateOutputSize(); showStatus( `「${file.name}」を読み込みました。`, false ); } /* ================================ 倍率変更 ================================ */ scale.addEventListener("change", () => { if(scale.value === "custom"){ updateOutputSize(); return; } const s = Number(scale.value); widthInput.value = Math.max(1, Math.round(originalWidth * s)); heightInput.value = Math.max(1, Math.round(originalHeight * s)); updateOutputSize(); }); widthInput.addEventListener("input", () => { scale.value = "custom"; updateOutputSize(); }); heightInput.addEventListener("input", () => { scale.value = "custom"; updateOutputSize(); }); /* ================================ 品質 ================================ */ quality.addEventListener("input", () => { qualityValue.textContent = Math.round(Number(quality.value) * 100) + "%"; }); /* ================================ サイズ表示 ================================ */ function updateOutputSize(){ const w = Math.max( 1, parseInt(widthInput.value) || 1 ); const h = Math.max( 1, parseInt(heightInput.value) || 1 ); outputSize.textContent = `${w.toLocaleString()} × ${h.toLocaleString()} px`; } /* ================================ SVG変換 ================================ */ convertBtn.addEventListener("click", async () => { if(!currentSVG){ return; } const w = Math.max( 1, parseInt(widthInput.value) || 1 ); const h = Math.max( 1, parseInt(heightInput.value) || 1 ); /* 極端に大きなCanvasによる ブラウザクラッシュを防止 */ const pixels = w * h; if( pixels > 100000000 ){ const ok = confirm( "非常に大きな画像サイズです。\n\n" + `${w.toLocaleString()} × ${h.toLocaleString()} px\n\n` + "メモリを大量に使用する可能性があります。\n" + "このまま変換しますか？" ); if(!ok){ return; } } showStatus( "変換しています…", false ); try{ const img = new Image(); const blob = new Blob( [currentSVG], {type:"image/svg+xml;charset=utf-8"} ); const url = URL.createObjectURL(blob); await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; }); canvas.width = w; canvas.height = h; const ctx = canvas.getContext( "2d", {alpha:true} ); ctx.clearRect( 0, 0, w, h ); /* JPGの場合は透明を使えないため 背景色を先に塗る */ if(format.value === "jpeg"){ ctx.fillStyle = bgColor.value; ctx.fillRect( 0, 0, w, h ); } /* 高品質補間 */ ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high"; ctx.drawImage( img, 0, 0, w, h ); URL.revokeObjectURL(url); let mime; if(format.value === "jpeg"){ mime = "image/jpeg"; }else if(format.value === "webp"){ mime = "image/webp"; }else{ mime = "image/png"; } const q = Number(quality.value); convertedBlob = await new Promise(resolve => { canvas.toBlob( resolve, mime, q ); }); if(!convertedBlob){ throw new Error( "画像データの生成に失敗しました。" ); } downloadBtn.disabled = false; showStatus( `変換完了：${w.toLocaleString()} × ${h.toLocaleString()} px`, false ); }catch(error){ console.error(error); showStatus( "変換に失敗しました。SVGの内容やサイズを確認してください。", true ); } }); /* ================================ 保存 ================================ */ downloadBtn.addEventListener("click", () => { if(!convertedBlob){ return; } let ext; if(format.value === "jpeg"){ ext = "jpg"; }else{ ext = format.value; } let baseName = currentFile.name .replace(/\.svg$/i, ""); const w = parseInt(widthInput.value); const h = parseInt(heightInput.value); const name = `${baseName}_${w}x${h}.${ext}`; const url = URL.createObjectURL( convertedBlob ); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => { URL.revokeObjectURL(url); }, 1000); }); /* ================================ リセット ================================ */ resetBtn.addEventListener("click", () => { currentSVG = ""; currentFile = null; convertedBlob = null; mainArea.classList.add("hidden"); downloadBtn.disabled = true; canvas.width = 1; canvas.height = 1; svgPreview.removeAttribute("src"); fileInput.value = ""; showStatus( "リセットしました。", false ); }); /* ================================ ステータス ================================ */ function showStatus(message, error){ status.textContent = message; status.classList.add("show"); if(error){ status.style.background = "#fef2f2"; status.style.color = "#991b1b"; }else{ status.style.background = "#eef6ff"; status.style.color = "#1e40af"; } } /* ================================ 初期化 ================================ */ updateOutputSize(); </script> </body> </html>
