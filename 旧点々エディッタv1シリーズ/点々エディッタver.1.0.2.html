<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像ドットアート生成ツール</title>
    <style>
        :root {
            --bg-color: #111827;
            --panel-color: #1f2937;
            --accent-color: #10b981;
            --text-color: #f9fafb;
            --control-bg: #374151;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.6rem; margin-bottom: 5px; color: var(--accent-color); }
        p { font-size: 0.9rem; color: #9ca3af; margin-top: 0; margin-bottom: 20px; }
        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--panel-color);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: var(--control-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #4b5563;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .control-group label { margin-bottom: 6px; color: #e5e7eb; }
        .control-group input[type="range"], .control-group input[type="number"], .control-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #4b5563;
            border-radius: 6px;
            background: #1f2937;
            color: #fff;
        }
        .control-group input[type="range"] { padding: 0; }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            grid-column: 1 / -1;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            flex: 1;
        }
        button:hover { background-color: #1d4ed8; transform: translateY(-1px); }
        button#copyBtn { background-color: #10b981; }
        button#copyBtn:hover { background-color: #059669; }
        button:disabled { background-color: #4b5563; color: #9ca3af; cursor: not-allowed; transform: none; }
        
        #canvas-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090d16;
            border-radius: 12px;
            overflow: hidden;
            padding: 15px;
            box-sizing: border-box;
            min-height: 450px;
        }
        canvas {
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background: #ffffff;
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
        }
        #status { text-align: center; font-size: 0.9rem; margin-top: 12px; color: var(--accent-color); font-weight: bold; }
        
        #textarea-wrapper {
            margin-top: 20px;
            width: 100%;
            display: none;
        }
        #textarea-wrapper textarea {
            width: 100%;
            height: 140px;
            box-sizing: border-box;
            padding: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            border: 1px solid #4b5563;
            border-radius: 8px;
            resize: vertical;
            background: #111827;
            color: #10b981;
        }
    </style>
</head>
<body>

    <h1>画像ドットアート生成ツール</h1>
    <p>服や髪のグラデーション、淡い色もムラなく超綺麗に塗り潰せます。</p>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="imageLoader">① 画像を選択</label>
                <input type="file" id="imageLoader" accept="image/*">
            </div>
            <div class="control-group">
                <label for="targetMode">② 抽出ターゲット</label>
                <select id="targetMode">
                    <option value="all" selected>背景も含む「画像全体」（綺麗に塗るならコレ）</option>
                    <option value="edge">画像の「輪郭（エッジ）」だけ</option>
                </select>
            </div>
            <div class="control-group">
                <label for="colorMode">③ 描画カラー</label>
                <select id="colorMode">
                    <option value="color">画像の色を詳細検知（高再現カラー）</option>
                    <option value="black">単色（漆黒・ダークグレー）</option>
                </select>
            </div>
            <div class="control-group">
                <label for="stepRange">④ 点の間隔（1が最高品質・服も隙間なし）</label>
                <input type="range" id="stepRange" min="1" max="12" value="1" step="1">
                <span id="densityLabel" style="font-size:0.75rem; color:#10b981; margin-top:2px; text-align:right;">間隔: 1px 【★品質極限ターボ】</span>
            </div>
            <div class="control-group">
                <label for="dotSize">⑤ 点の大きさ設定</label>
                <select id="dotSize">
                    <option value="auto" selected>自動モード（服を最高に綺麗に埋める）</option>
                    <option value="0.5">固定：極小 (0.5)</option>
                    <option value="1.0">固定：小 (1.0)</option>
                    <option value="1.8">固定：中 (1.8)</option>
                    <option value="3.0">固定：大 (3.0)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="threshold">⑥ 輪郭の感度（輪郭モード用）</label>
                <input type="range" id="threshold" min="5" max="100" value="25" step="5">
            </div>
            <div class="control-group">
                <label for="maxLines">⑦ コピペ最大データ行数（0で無制限）</label>
                <input type="number" id="maxLines" min="0" value="5000">
            </div>
            <div class="btn-group">
                <button id="restartBtn" disabled>設定を反映して再生成</button>
                <button id="copyBtn" disabled>点データ（文字）を出力してコピー</button>
            </div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="imageCanvas"></canvas>
        </div>
        <div id="status">画像を選択してください</div>

        <div id="textarea-wrapper">
            <label style="font-size:0.8rem; font-weight:bold; color:#9ca3af;">自動コピーが失敗した場合は、下をクリックして全選択し、コピー（Ctrl+C）してください：</label>
            <textarea id="outputData" readonly onclick="this.select();"></textarea>
        </div>
    </div>

    <script {nonce}>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const targetModeSelect = document.getElementById('targetMode');
        const colorModeSelect = document.getElementById('colorMode');
        const stepRange = document.getElementById('stepRange');
        const densityLabel = document.getElementById('densityLabel');
        const dotSizeSelect = document.getElementById('dotSize');
        const thresholdInput = document.getElementById('threshold');
        const maxLinesInput = document.getElementById('maxLines');
        const copyBtn = document.getElementById('copyBtn');
        const restartBtn = document.getElementById('restartBtn');
        const statusText = document.getElementById('status');
        const textareaWrapper = document.getElementById('textarea-wrapper');
        const outputData = document.getElementById('outputData');

        let animationFrameId;
        let currentImg = null;
        let allPoints = []; 

        stepRange.addEventListener('input', () => {
            const val = stepRange.value;
            if (val === "1") {
                densityLabel.innerText = "間隔: 1px 【★品質極限ターボ】";
                densityLabel.style.color = "#10b981";
            } else {
                densityLabel.innerText = `間隔: ${val}px`;
                densityLabel.style.color = "#9ca3af";
            }
        });

        imageLoader.addEventListener('change', handleImage, false);
        restartBtn.addEventListener('click', () => { if(currentImg) processImage(currentImg); });
        copyBtn.addEventListener('click', copyPointsToClipboard);

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    restartBtn.disabled = false;
                    processImage(img);
                }
                img.src = event.target.result;
            }
            if(e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        function processImage(img) {
            cancelAnimationFrame(animationFrameId);
            copyBtn.disabled = true;
            textareaWrapper.style.display = 'none'; 
            statusText.innerText = "キャラ絵スキャンエンジン起動中...";

            const maxDimension = 1000; 
            let scale = 1;

            if (img.width > maxDimension || img.height > maxDimension) {
                scale = img.width > img.height ? maxDimension / img.width : maxDimension / img.height;
            }

            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            allPoints = extractPoints(imgData);
            
            let drawPoints = [...allPoints];
            shuffleArray(drawPoints);

            statusText.innerText = `スキャン完了: ${allPoints.length} 個のドットを配置。綺麗に塗っています...`;
            animatePoints(drawPoints);
        }

        function extractPoints(imgData) {
            const w = imgData.width;
            const h = imgData.height;
            const d = imgData.data;
            const points = [];
            const targetMode = targetModeSelect.value;
            const step = parseInt(stepRange.value); 
            const thresh = parseInt(thresholdInput.value);

            function getPixelInfo(x, y) {
                if (x < 0 || x >= w || y < 0 || y >= h) return { lum: 255, r: 255, g: 255, b: 255, a: 0 };
                const i = (y * w + x) * 4;
                return { 
                    r: d[i], 
                    g: d[i+1], 
                    b: d[i+2], 
                    a: d[i+3],
                    lum: 0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2]
                };
            }

            for (let y = 0; y < h; y += step) {
                for (let x = 0; x < w; x += step) {
                    const center = getPixelInfo(x, y);

                    // 【超改良】背景カットの条件を緩和。
                    // RGBがすべて252以上の「ほぼ純白の背景」か、透明(a=0)な部分だけを弾く。
                    // これにより淡い色の服、パステルカラー、薄い肌色が絶対に消えなくなりました！
                    if (center.a === 0 || (center.r >= 252 && center.g >= 252 && center.b >= 252)) continue;

                    if (targetMode === 'all') {
                        points.push({ x: x, y: y, color: `rgb(${center.r},${center.g},${center.b})` });
                    } else {
                        const right = getPixelInfo(x + step, y);
                        const bottom = getPixelInfo(x, y + step);
                        const hGrad = right.lum - center.lum;
                        const vGrad = bottom.lum - center.lum;
                        const magnitude = Math.sqrt(hGrad * hGrad + vGrad * vGrad);

                        if (magnitude > thresh) {
                            points.push({ x: x, y: y, color: `rgb(${center.r},${center.g},${center.b})` });
                        }
                    }
                }
            }
            return points;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function animatePoints(points) {
            let index = 0;
            const isColor = (colorModeSelect.value === 'color');
            const step = parseInt(stepRange.value);
            
            // 自動サイズの計算をさらに細密化（服の隙間を完璧に埋める比率）
            let radius;
            if (dotSizeSelect.value === 'auto') {
                radius = step === 1 ? 0.72 : step * 0.68; // わずかに大きくして隙間をなくす
            } else {
                radius = parseFloat(dotSizeSelect.value);
            }
            
            const baseSpeed = step === 1 ? 500 : 120;
            const pointsPerFrame = Math.max(baseSpeed, Math.floor(points.length / 55)); 

            function draw() {
                for (let i = 0; i < pointsPerFrame; i++) {
                    if (index >= points.length) {
                        statusText.innerText = `完成！ 限界突破総ドット数: ${allPoints.length} 個`;
                        copyBtn.disabled = false; 
                        return;
                    }

                    const pt = points[index];
                    
                    // 【バグ修正】青っぽくなる問題を修正、単色時は締まった黒（#111111）で描画
                    ctx.fillStyle = isColor ? pt.color : '#111111'; 

                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    index++;
                }
                animationFrameId = requestAnimationFrame(draw);
            }
            draw();
        }

        function copyPointsToClipboard() {
            if (allPoints.length === 0) return;

            const maxLines = parseInt(maxLinesInput.value) || 0;
            let pointsToCopy = [...allPoints];

            if (maxLines > 0 && pointsToCopy.length > maxLines) {
                const sampledPoints = [];
                const step = pointsToCopy.length / maxLines;
                for (let i = 0; i < maxLines; i++) {
                    const index = Math.floor(i * step);
                    sampledPoints.push(pointsToCopy[index]);
                }
                pointsToCopy = sampledPoints;
            }

            let textData = "X,Y\n"; 
            textData += pointsToCopy.map(pt => `${pt.x},${pt.y}`).join("\n");

            outputData.value = textData;
            textareaWrapper.style.display = 'block';

            navigator.clipboard.writeText(textData).then(() => {
                alert(`ターボコピー完了！\nデータ行数: ${pointsToCopy.length} 行\n\nクリップボードに格納されました。`);
            }).catch(err => {
                alert(`データを作成しました。\n最下部のテキストエリアからコピーしてください。`);
            });
        }
    </script>
</body>
</html>
