<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像ドット＆文字アート生成ツール - 極限エッジ＆輪郭カラー版</title>
    <link rel="icon" type="image/png" href="4.png" sizes="32x32">
    <style>
        :root {
            --bg-color: #111827;
            --panel-color: #1f2937;
            --accent-color: #10b981;
            --text-color: #f9fafb;
            --control-bg: #374151;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.6rem; margin-bottom: 5px; color: var(--accent-color); }
        p { font-size: 0.9rem; color: #9ca3af; margin-top: 0; margin-bottom: 20px; }
        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--panel-color);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: var(--control-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #4b5563;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .control-group label { margin-bottom: 6px; color: #e5e7eb; }
        .control-group input[type="text"], .control-group input[type="range"], .control-group input[type="number"], .control-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #4b5563;
            border-radius: 6px;
            background: #1f2937;
            color: #fff;
        }
        .control-group input[type="range"] { padding: 0; }
        
        .step-input-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .step-input-container input[type="range"] {
            flex: 1;
        }
        .step-input-container input[type="number"] {
            width: 75px !important;
            text-align: center;
        }

        .sub-group {
            margin-left: 10px;
            border-left: 2px solid #4b5563;
            padding-left: 10px;
            margin-top: 5px;
        }
        
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            grid-column: 1 / -1;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            flex: 1;
            min-width: 150px;
        }
        button:hover { background-color: #1d4ed8; transform: translateY(-1px); }
        button#saveBtn { background-color: #ea580c; }
        button#saveBtn:hover { background-color: #c2410c; }
        button#copyBtn { background-color: #10b981; }
        button#copyBtn:hover { background-color: #059669; }
        button:disabled { background-color: #4b5563; color: #9ca3af; cursor: not-allowed; transform: none; }
        
        #canvas-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090d16;
            border-radius: 12px;
            overflow: hidden;
            padding: 15px;
            box-sizing: border-box;
            min-height: 450px;
        }
        canvas {
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background: #ffffff;
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
        }
        #status { text-align: center; font-size: 0.9rem; margin-top: 12px; color: var(--accent-color); font-weight: bold; }
        
        #textarea-wrapper {
            margin-top: 20px;
            width: 100%;
            display: none;
        }
        #textarea-wrapper textarea {
            width: 100%;
            height: 180px;
            box-sizing: border-box;
            padding: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            border: 1px solid #4b5563;
            border-radius: 8px;
            resize: vertical;
            background: #111827;
            color: #10b981;
        }
    </style>
</head>
<body>

    <h1>画像ドット＆文字アート生成ツール - 極限エッジ＆輪郭カラー版</h1>
    <p>外部ツール連携用：座標に加え「配置した文字」と「RGBカラー」をすべて含めて書き出します。</p>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="imageLoader">① 画像を選択</label>
                <input type="file" id="imageLoader" accept="image/*">
            </div>
            
            <div class="control-group">
                <label for="drawStyle">② 描画スタイル</label>
                <select id="drawStyle">
                    <option value="dot" selected>標準：丸いドット（点）</option>
                    <option value="text">特殊：文字（アスキーアート風）</option>
                    <option value="icon">超特殊：カスタムアイコン（スタンプ風）</option>
                </select>
            </div>
            
            <div class="control-group" id="charInputGroup" style="opacity: 0.5;">
                <label for="charText">└ 描画用の文字（ループされます）</label>
                <input type="text" id="charText" value="@A/1#*+" placeholder="例: @A/1">
            </div>

            <div class="control-group" id="iconInputGroup" style="display: none;">
                <label for="iconLoader">└ 描画用のアイコン画像（複数選択可）</label>
                <input type="file" id="iconLoader" accept="image/*" multiple>
                <span id="iconCountLabel" style="font-size:0.75rem; color:#9ca3af; margin-top:4px;">未選択（デフォルトの形状が使われます）</span>
            </div>

            <div class="control-group">
                <label for="targetMode">③ 抽出ターゲット</label>
                <select id="targetMode">
                    <option value="all">背景も含む「画像全体」</option>
                    <option value="edge">通常の「輪郭（エッジ）」</option>
                    <option value="ultraEdge" selected>⚡ 超輪郭検知システム（多方向高精度極限エッジ）</option>
                </select>
            </div>

            <div class="control-group">
                <label for="colorMode">④ 描画カラー設定</label>
                <select id="colorMode">
                    <option value="outlineColor" selected>🎨 カラーに輪郭だけ塗るモード（線画連動カラー）</option>
                    <option value="hyperColor">✨ 超超カラー再現モード（ディザリング高階調）</option>
                    <option value="color">通常カラー（画像の色をストレート検知）</option>
                    <option value="monoAdjustment">🖤 白黒調整写真モード（輝度コントロール）</option>
                    <option value="black">単色（漆黒固定：R17,G17,B17）</option>
                </select>

                <div id="monoConfigArea" class="sub-group" style="display: none;">
                    <label for="monoContrast" style="color:#9ca3af; display:block; margin-bottom:4px;">└ 白黒コントラスト微調整</label>
                    <div class="step-input-container">
                        <input type="range" id="monoContrast" min="-100" max="100" value="0" step="5">
                        <input type="number" id="monoContrastNum" min="-100" max="100" value="0" step="5" style="width:60px!important;">
                    </div>
                </div>
            </div>
            
            <div class="control-group">
                <label for="stepRange">⑤ 点・文字の間隔（0.1〜12pxまで自由入力）</label>
                <div class="step-input-container">
                    <input type="range" id="stepRange" min="0.1" max="12" value="1.2" step="0.1">
                    <input type="number" id="stepNumber" min="0.1" max="12" value="1.2" step="0.1" placeholder="1.2">
                </div>
                <span id="densityLabel" style="font-size:0.75rem; color:#10b981; margin-top:4px; text-align:right;">間隔: 1.2px</span>
            </div>

            <div class="control-group">
                <label for="dotSize">⑥ サイズ設定（自動推奨）</label>
                <select id="dotSize">
                    <option value="auto" selected>自動モード</option>
                    <option value="0.1">固定：超微小 (0.1)</option>
                    <option value="0.3">固定：極小 (0.3)</option>
                    <option value="0.5">固定：微小 (0.5)</option>
                    <option value="1.0">固定：小 (1.0)</option>
                    <option value="1.8">固定：中 (1.8)</option>
                    <option value="3.0">固定：大 (3.0)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="threshold">⑦ 輪郭検知・感度マックス（数値が低いほど超高感度）</label>
                <input type="range" id="threshold" min="2" max="100" value="15" step="1">
            </div>

            <div class="control-group" style="grid-column: span 1;">
                <label for="maskMode">⑧ 型抜き（切り切り）設定</label>
                <select id="maskMode">
                    <option value="none" selected>画像全体の形のまま（型抜きなし）</option>
                    <option value="char">指定した文字列の形に型抜きする</option>
                </select>
                
                <div id="maskConfigArea" class="sub-group" style="display: none; opacity: 0.5;">
                    <div style="margin-bottom: 8px;">
                        <label for="maskChar" style="color:#9ca3af; display:block; margin-bottom:4px;">└ 型抜き用の文字列</label>
                        <input type="text" id="maskChar" value="HELLO" placeholder="例: ART">
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                        <div>
                            <label for="maskOffsetX" style="color:#9ca3af; display:block; margin-bottom:4px;">位置(X)</label>
                            <input type="number" id="maskOffsetX" value="0" step="5">
                        </div>
                        <div>
                            <label for="maskOffsetY" style="color:#9ca3af; display:block; margin-bottom:4px;">位置(Y)</label>
                            <input type="number" id="maskOffsetY" value="0" step="5">
                        </div>
                        <div>
                            <label for="maskScale" style="color:#9ca3af; display:block; margin-bottom:4px;">倍率(%)</label>
                            <input type="number" id="maskScale" value="100" min="10" max="500" step="5">
                        </div>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label for="drawIntensity">⑨ 描画の濃さ（重ね描き厚み設定）</label>
                <select id="drawIntensity">
                    <option value="1" selected>標準（通常のストレート描写）</option>
                    <option value="2">濃いめ（ダブル・レイヤードプロット）</option>
                    <option value="3">極濃（トリプル・ボールドインパクト）</option>
                    <option value="4">超限界濃（クアッド・マキシマム飽和）</option>
                </select>
            </div>

            <div class="control-group">
                <label for="maxLines">⑩ コピペ最大データ行数（0で無制限）</label>
                <input type="number" id="maxLines" min="0" value="15000">
            </div>
            
            <div class="btn-group">
                <button id="restartBtn" disabled>設定を反映して再生成</button>
                <button id="saveBtn" disabled>画像を保存する</button>
                <button id="copyBtn" disabled>色・文字入りデータをまとめてコピー</button>
            </div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="imageCanvas"></canvas>
        </div>
        <div id="status">画像を選択してください</div>

        <div id="textarea-wrapper">
            <label id="textareaLabel" style="font-size:0.8rem; font-weight:bold; color:#9ca3af;"></label>
            <textarea id="outputData" readonly onclick="this.select();"></textarea>
        </div>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const drawStyleSelect = document.getElementById('drawStyle');
        const charTextInput = document.getElementById('charText'); 
        const charInputGroup = document.getElementById('charInputGroup');
        const iconInputGroup = document.getElementById('iconInputGroup');
        const iconLoader = document.getElementById('iconLoader');
        const iconCountLabel = document.getElementById('iconCountLabel');
        const targetModeSelect = document.getElementById('targetMode');
        const colorModeSelect = document.getElementById('colorMode');
        
        const monoConfigArea = document.getElementById('monoConfigArea');
        const monoContrast = document.getElementById('monoContrast');
        const monoContrastNum = document.getElementById('monoContrastNum');

        const stepRange = document.getElementById('stepRange');
        const stepNumber = document.getElementById('stepNumber');
        
        const densityLabel = document.getElementById('densityLabel');
        const dotSizeSelect = document.getElementById('dotSize');
        const thresholdInput = document.getElementById('threshold');
        const maskModeSelect = document.getElementById('maskMode');
        const maskCharInput = document.getElementById('maskChar');
        const maskConfigArea = document.getElementById('maskConfigArea');
        const maskOffsetX = document.getElementById('maskOffsetX');
        const maskOffsetY = document.getElementById('maskOffsetY');
        const maskScale = document.getElementById('maskScale');
        const drawIntensitySelect = document.getElementById('drawIntensity'); // 濃さ用
        const maxLinesInput = document.getElementById('maxLines');
        const restartBtn = document.getElementById('restartBtn');
        const saveBtn = document.getElementById('saveBtn');
        const copyBtn = document.getElementById('copyBtn');
        const statusText = document.getElementById('status');
        const textareaWrapper = document.getElementById('textarea-wrapper');
        const outputData = document.getElementById('outputData');
        const textareaLabel = document.getElementById('textareaLabel');

        let animationFrameId;
        let currentImg = null;
        let allPoints = []; 
        let loadedIcons = []; // 読み込まれたスタンプアイコン画像を保持する配列

        // スタイル変更時の表示切り替え制御（アイコンモード追加に伴う拡張）
        drawStyleSelect.addEventListener('change', () => {
            const val = drawStyleSelect.value;
            if (val === 'text') {
                charInputGroup.style.display = "flex";
                charInputGroup.style.opacity = "1";
                iconInputGroup.style.display = "none";
            } else if (val === 'icon') {
                charInputGroup.style.display = "none";
                iconInputGroup.style.display = "flex";
            } else {
                charInputGroup.style.display = "flex";
                charInputGroup.style.opacity = "0.5";
                iconInputGroup.style.display = "none";
            }
        });

        // アイコン画像の複数読み込み処理
        iconLoader.addEventListener('change', (e) => {
            loadedIcons = [];
            const files = e.target.files;
            if (!files.length) {
                iconCountLabel.innerText = "未選択（デフォルトの形状が使われます）";
                return;
            }
            
            let loadedCount = 0;
            for (let i = 0; i < files.length; i++) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        loadedIcons.push(img);
                        loadedCount++;
                        if (loadedCount === files.length) {
                            iconCountLabel.innerText = `読み込み完了: ${loadedIcons.length}個のアイコン`;
                        }
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(files[i]);
            }
        });

        maskModeSelect.addEventListener('change', () => {
            if (maskModeSelect.value === 'char') {
                maskConfigArea.style.display = "block";
                setTimeout(() => maskConfigArea.style.opacity = "1", 10);
            } else {
                maskConfigArea.style.opacity = "0.5";
                maskConfigArea.style.display = "none";
            }
        });

        colorModeSelect.addEventListener('change', () => {
            monoConfigArea.style.display = (colorModeSelect.value === 'monoAdjustment') ? "block" : "none";
        });

        monoContrast.addEventListener('input', (e) => { monoContrastNum.value = e.target.value; });
        monoContrastNum.addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val)) return;
            if (val < -100) val = -100;
            if (val > 100) val = 100;
            monoContrast.value = val;
        });

        stepRange.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            stepNumber.value = val;
            updateDensityLabel(val);
        });

        stepNumber.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            if (isNaN(val)) return;
            if (val < 0.1) val = 0.1;
            if (val > 12) val = 12;
            stepRange.value = val;
            updateDensityLabel(val);
        });

        function updateDensityLabel(val) {
            if (val <= 0.4) {
                densityLabel.innerText = `間隔: ${val}px 【🚨神話級・世界崩壊ハイパーモード】`;
                densityLabel.style.color = "#ef4444";
            } else if (val === 0.5) {
                densityLabel.innerText = "間隔: 0.5px 【★★ハイパー限界突破モード】";
                densityLabel.style.color = "#ec4899";
            } else if (val === 1) {
                densityLabel.innerText = "間隔: 1px 【★品質極限ターボ】";
                densityLabel.style.color = "#10b981";
            } else {
                densityLabel.innerText = `間隔: ${val}px`;
                densityLabel.style.color = "#9ca3af";
            }
        }

        imageLoader.addEventListener('change', handleImage, false);
        restartBtn.addEventListener('click', () => { if(currentImg) processImage(currentImg); });
        saveBtn.addEventListener('click', saveCanvasAsImage);
        copyBtn.addEventListener('click', copyPointsToClipboard);

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    restartBtn.disabled = false;
                    processImage(img);
                }
                img.src = event.target.result;
            }
            if(e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        function processImage(img) {
            cancelAnimationFrame(animationFrameId);
            copyBtn.disabled = true;
            saveBtn.disabled = true;
            textareaWrapper.style.display = 'none'; 
            statusText.innerText = "超輪郭スキャンマトリクス展開中...";

            const maxDimension = 1000; 
            let scale = 1;

            if (img.width > maxDimension || img.height > maxDimension) {
                scale = img.width > img.height ? maxDimension / img.width : maxDimension / img.height;
            }

            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);

            let step = parseFloat(stepNumber.value) || 1.0;
            const estimatedPoints = (canvas.width / step) * (canvas.height / step);
            if (estimatedPoints > 3000000) { 
                step = Math.sqrt((canvas.width * canvas.height) / 3000000);
                step = Math.ceil(step * 10) / 10; 
                stepNumber.value = step;
                stepRange.value = step;
                updateDensityLabel(step);
                alert(`【フリーズ防止安全装置】自動的に [間隔: ${step}px] にマッピングしました。`);
            }

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            let maskData = null;
            if (maskModeSelect.value === 'char') {
                maskData = createMaskMap(
                    canvas.width, 
                    canvas.height, 
                    maskCharInput.value || "HELLO",
                    parseFloat(maskOffsetX.value) || 0,
                    parseFloat(maskOffsetY.value) || 0,
                    (parseFloat(maskScale.value) || 100) / 100
                );
            }

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 高性能輪郭・カラー抽出処理
            allPoints = extractPoints(imgData, maskData, step);
            
            let drawPoints = [...allPoints];
            shuffleArray(drawPoints);

            statusText.innerText = `解析完了: ${allPoints.length} 個の限界点を発見。キャンバスへプロット中...`;
            animatePoints(drawPoints, step);
        }

        function createMaskMap(w, h, text, offsetX, offsetY, scaleMultiplier) {
            const offscreen = document.createElement('canvas');
            offscreen.width = w;
            offscreen.height = h;
            const oCtx = offscreen.getContext('2d');
            oCtx.fillStyle = '#000000';
            oCtx.fillRect(0, 0, w, h);
            oCtx.fillStyle = '#ffffff';
            
            let fontSize = Math.min(w, h) * 0.9;
            oCtx.font = `bold ${fontSize}px sans-serif`;
            let textWidth = oCtx.measureText(text).width;
            
            while (textWidth > w * 0.95 && fontSize > 10) {
                fontSize -= 5;
                oCtx.font = `bold ${fontSize}px sans-serif`;
                textWidth = oCtx.measureText(text).width;
            }
            
            fontSize *= scaleMultiplier;
            oCtx.font = `bold ${fontSize}px sans-serif`;
            oCtx.textAlign = "center";
            oCtx.textBaseline = "middle";
            
            oCtx.fillText(text, (w / 2) + offsetX, (h / 2) + offsetY);
            return oCtx.getImageData(0, 0, w, h).data;
        }

        function extractPoints(imgData, maskData, step) {
            const w = imgData.width;
            const h = imgData.height;
            const d = imgData.data;
            const points = [];
            const targetMode = targetModeSelect.value;
            const thresh = parseInt(thresholdInput.value);
            const style = drawStyleSelect.value;
            const charList = charTextInput.value || "@";
            const colorMode = colorModeSelect.value;
            const contrastFactor = (parseInt(monoContrast.value) + 100) / 100;

            let errorBufR, errorBufG, errorBufB;
            if (colorMode === 'hyperColor') {
                errorBufR = new Float32Array(w * h);
                errorBufG = new Float32Array(w * h);
                errorBufB = new Float32Array(w * h);
            }

            let pointCounter = 0;

            function getLum(kx, ky) {
                if (kx < 0 || kx >= w || ky < 0 || ky >= h) return 255;
                const idx = (ky * w + kx) * 4;
                return 0.2126 * d[idx] + 0.7152 * d[idx+1] + 0.0722 * d[idx+2];
            }

            for (let y = 0; y < h; y += step) {
                for (let x = 0; x < w; x += step) {
                    const ix = Math.floor(x);
                    const iy = Math.floor(y);
                    if (ix >= w || iy >= h) continue;

                    if (maskData) {
                        const maskIndex = (iy * w + ix) * 4;
                        if (maskIndex >= maskData.length || maskData[maskIndex] < 128) continue; 
                    }

                    const i = (iy * w + ix) * 4;
                    if (d[i+3] === 0 || (d[i] >= 254 && d[i+1] >= 254 && d[i+2] >= 254)) continue;

                    let r = d[i];
                    let g = d[i+1];
                    let b = d[i+2];
                    const centerLum = 0.2126 * r + 0.7152 * g + 0.0722 * b;

                    // --- 抽出ターゲット：超輪郭検知システム ---
                    if (targetMode === 'ultraEdge') {
                        const l00 = getLum(ix - 1, iy - 1); const l10 = getLum(ix, iy - 1); const l20 = getLum(ix + 1, iy - 1);
                        const l01 = getLum(ix - 1, iy);                                    const l21 = getLum(ix + 1, iy);
                        const l02 = getLum(ix - 1, iy + 1); const l12 = getLum(ix, iy + 1); const l22 = getLum(ix + 1, iy + 1);

                        const gX = (l20 + (2 * l21) + l22) - (l00 + (2 * l01) + l02);
                        const gY = (l02 + (2 * l12) + l22) - (l00 + (2 * l10) + l20);
                        
                        const laplacian = Math.abs((l10 + l01 + l21 + l12) - (4 * centerLum));
                        const edgeMagnitude = Math.sqrt(gX * gX + gY * gY) + (laplacian * 0.6);

                        if (edgeMagnitude < thresh) continue;

                    } else if (targetMode === 'edge') {
                        const rLum = getLum(ix + 1, iy);
                        const bLum = getLum(ix, iy + 1);
                        const magnitude = Math.sqrt(Math.pow(rLum - centerLum, 2) + Math.pow(bLum - centerLum, 2));
                        if (magnitude < thresh) continue;
                    }

                    // 描画スタイルに応じたメタデータの割り当て
                    let assignedChar = "●";
                    let iconIndex = -1;
                    
                    if (style === 'text') {
                        assignedChar = charList[pointCounter % charList.length];
                    } else if (style === 'icon') {
                        assignedChar = "[Icon]"; // データ出力用の識別文字
                        if (loadedIcons.length > 0) {
                            iconIndex = pointCounter % loadedIcons.length;
                        }
                    }

                    let finalR, finalG, finalB;

                    // --- 描画カラーロジック ---
                    if (colorMode === 'outlineColor' || colorMode === 'color') {
                        finalR = r; finalG = g; finalB = b;
                    } else if (colorMode === 'hyperColor') {
                        const bufIdx = iy * w + ix;
                        let er = r + errorBufR[bufIdx];
                        let eg = g + errorBufG[bufIdx];
                        let eb = b + errorBufB[bufIdx];

                        finalR = Math.min(255, Math.max(0, Math.round(er)));
                        finalG = Math.min(255, Math.max(0, Math.round(eg)));
                        finalB = Math.min(255, Math.max(0, Math.round(eb)));

                        const currentErrR = er - finalR;
                        const currentErrG = eg - finalG;
                        const currentErrB = eb - finalB;

                        if (ix + 1 < w) {
                            errorBufR[bufIdx + 1] += currentErrR * 0.45;
                            errorBufG[bufIdx + 1] += currentErrG * 0.45;
                            errorBufB[bufIdx + 1] += currentErrB * 0.45;
                        }
                        if (iy + 1 < h) {
                            errorBufR[bufIdx + w] += currentErrR * 0.45;
                            errorBufG[bufIdx + w] += currentErrG * 0.45;
                            errorBufB[bufIdx + w] += currentErrB * 0.45;
                        }
                    } else if (colorMode === 'monoAdjustment') {
                        let mono = (centerLum - 128) * contrastFactor + 128; 
                        let gray = Math.min(255, Math.max(0, Math.round(mono)));
                        finalR = gray; finalG = gray; finalB = gray;
                    } else {
                        finalR = 17; finalG = 17; finalB = 17;
                    }

                    points.push({ 
                        x: x, 
                        y: y, 
                        char: assignedChar, 
                        r: finalR, 
                        g: finalG, 
                        b: finalB,
                        iconIndex: iconIndex 
                    });
                    pointCounter++;
                }
            }
            return points;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function animatePoints(points, step) {
            let index = 0;
            const style = drawStyleSelect.value;
            const intensity = parseInt(drawIntensitySelect.value) || 1; // 描画の濃さ(1〜4)
            
            let size;
            if (dotSizeSelect.value === 'auto') {
                if (step <= 0.2) { size = (style === 'text' || style === 'icon') ? 0.35 : 0.16; } 
                else if (step <= 0.5) { size = (style === 'text' || style === 'icon') ? 0.7 : 0.38; } 
                else if (step === 1) { size = (style === 'text' || style === 'icon') ? 1.3 : 0.72; } 
                else { size = (style === 'text' || style === 'icon') ? step * 1.1 : step * 0.68; }
            } else {
                size = parseFloat(dotSizeSelect.value) * ((style === 'text' || style === 'icon') ? 1.4 : 1.0); 
            }
            
            if (style === 'text') {
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
            }

            const pointsPerFrame = Math.max(3000, Math.floor(points.length / 40)); 

            // 一つの点・文字を描画するインライン合成関数
            function drawElement(pt) {
                ctx.fillStyle = `rgb(${pt.r},${pt.g},${pt.b})`; 

                if (style === 'text') {
                    // 濃さが2以上の場合は太字度合いや微妙なずらし効果で濃さを表現
                    ctx.font = `${intensity > 2 ? '900' : 'bold'} ${size}px monospace`;
                    ctx.fillText(pt.char, pt.x, pt.y);
                } else if (style === 'icon' && loadedIcons.length > 0 && pt.iconIndex !== -1) {
                    // アイコン描画モード
                    const icon = loadedIcons[pt.iconIndex];
                    ctx.save();
                    ctx.translate(pt.x, pt.y);
                    
                    // 元画像の色を乗せる処理 (黒単色ブレンド以外の場合)
                    if (colorModeSelect.value !== 'black') {
                        ctx.globalCompositeOperation = 'source-over';
                    }
                    
                    // 濃さ設定に応じてサイズや透明度を調整してスタンプ
                    const iconSize = size * 1.5; 
                    ctx.drawImage(icon, -iconSize / 2, -iconSize / 2, iconSize, iconSize);
                    
                    // カラーオーバーレイ（アイコンに検出したカラーを合成するコアロジック）
                    ctx.globalCompositeOperation = 'source-atop';
                    ctx.fillStyle = `rgb(${pt.r},${pt.g},${pt.b})`;
                    ctx.fillRect(-iconSize / 2, -iconSize / 2, iconSize, iconSize);
                    ctx.restore();
                } else {
                    // 通常ドットモード（濃さ設定に応じて円の描画を強化）
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function draw() {
                for (let i = 0; i < pointsPerFrame; i++) {
                    if (index >= points.length) {
                        statusText.innerText = `極限マッピング完了！ 総エッジドット数: ${allPoints.length} 個`;
                        copyBtn.disabled = false; 
                        saveBtn.disabled = false; 
                        return;
                    }

                    const pt = points[index];
                    
                    // 【濃さ機能】指定されたレイヤー回数分、ループして重ね描きを行う
                    for(let loop = 0; loop < intensity; loop++) {
                        // 2回目以降の重ね描きは、超微細な揺らぎ（0.1px未満）を与えることで既存形状を絶対に崩さず「太さ・濃さ」だけを強化する
                        if(loop === 0) {
                            drawElement(pt);
                        } else {
                            const layeredPt = {
                                ...pt,
                                x: pt.x + (Math.sin(loop) * 0.08),
                                y: pt.y + (Math.cos(loop) * 0.08)
                            };
                            drawElement(layeredPt);
                        }
                    }
                    index++;
                }
                animationFrameId = requestAnimationFrame(draw);
            }
            draw();
        }

        function saveCanvasAsImage() {
            if (allPoints.length === 0) return;
            const link = document.createElement('a');
            link.download = 'ultra_edge_art.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function copyPointsToClipboard() {
            if (allPoints.length === 0) return;

            const maxLines = parseInt(maxLinesInput.value) || 0;
            let pointsToCopy = [...allPoints];

            if (maxLines > 0 && pointsToCopy.length > maxLines) {
                const sampledPoints = [];
                const step = pointsToCopy.length / maxLines;
                for (let i = 0; i < maxLines; i++) {
                    const index = Math.floor(i * step);
                    sampledPoints.push(pointsToCopy[index]);
                }
                pointsToCopy = sampledPoints;
            }

            let textData = "X,Y,Char,R,G,B\n"; 
            textData += pointsToCopy.map(pt => 
                `${pt.x.toFixed(1)},${pt.y.toFixed(1)},${pt.char},${pt.r},${pt.g},${pt.b}`
            ).join("\n");

            outputData.value = textData;
            textareaLabel.innerText = `輪郭カラーデータを作成（総行数: ${pointsToCopy.length} 行）:`;
            textareaWrapper.style.display = 'block';

            navigator.clipboard.writeText(textData).then(() => {
                alert(`超輪郭データのコピー成功！\nデータ行数: ${pointsToCopy.length} 行\n\nクリップボードに格納されました。`);
            }).catch(err => {
                alert(`データを作成しました。最下部から手動コピーしてください。`);
            });
        }
    </script>
